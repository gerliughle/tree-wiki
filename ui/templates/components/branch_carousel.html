<div id="branch_carousel" class="carousel slide" data-bs-ride="carousel">
    {% if branch_images|length > 1 %}
        <div class="carousel-indicators">
            {% for image in branch_images %}
                <button type="button" data-bs-target="#branch_carousel" data-bs-slide-to="{{ loop.index - 1 }}"
                        {% if loop.first %}class="active" aria-current="true" {% endif %}
                        aria-label="Slide {{ loop.index }}"></button>
            {% endfor %}
        </div>
    {% endif %}
    <div class="carousel-inner rounded">

        {% for image in branch_images %}
            <div class="carousel-item {% if loop.first %}active{% endif %}">
                <img src="{{ url_for('static', filename='assets/USER_IMAGES/branch_images/' ~ image.id ~ image.ext) }}"
                     class="d-block w-100" alt="{{ image.name }}" loading="lazy"
                     style="height: 500px; object-fit: cover; object-position: center;">
                {% if image.caption %}
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-75 rounded shadow-sm p-3  ">
                        <p class="text-light mb-0">{{ image.caption }}</p>
                    </div>
                {% endif %}
            </div>
        {% endfor %}

    </div>
    {% if branch_images|length > 1 %}
        <button class="carousel-control-prev" type="button" data-bs-target="#branch_carousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#branch_carousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    {% endif %}
</div>
